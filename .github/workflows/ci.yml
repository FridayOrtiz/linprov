name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # `cargo clippy` / `cargo test` on linprov triggers its build.rs, which
  # cross-builds linprov-ebpf for the bpfel target via bpf-linker. So
  # bpf-linker has to be installed even for the lint job.
  lint-and-test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Prebuilt release, as bpf-linker's README recommends: since 0.13.0,
      # `cargo install bpf-linker` needs a system LLVM (`llvm-config`).
      - name: Install bpf-linker
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar -xpf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
          bpf-linker --version

      # linprov-ebpf's build.rs compiles src/shim.c (the CO-RE field
      # accessors) with clang.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace clippy only checks linprov-ebpf's lib stub for the
      # host; `src/main.rs` is gated by `required-features = ["bpf-build"]`.
      # Run it explicitly against the bpfel target so warnings in the BPF
      # program fail CI too.
      - name: cargo clippy (linprov-ebpf, bpfel target)
        run: >
          cargo clippy -p linprov-ebpf
          --target bpfel-unknown-none
          -Zbuild-std=core
          --features bpf-build
          --bin linprov-ebpf
          -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Belt-and-suspenders build job. Same toolchain, separate cache. If
  # lint-and-test passes but the full build trips something
  # release-profile-only, this catches it.
  build-daemon:
    name: build daemon (incl. BPF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: build-daemon

      # Prebuilt release, as bpf-linker's README recommends: since 0.13.0,
      # `cargo install bpf-linker` needs a system LLVM (`llvm-config`).
      - name: Install bpf-linker
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar -xpf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
          bpf-linker --version

      # linprov-ebpf's build.rs compiles src/shim.c (the CO-RE field
      # accessors) with clang.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: cargo build (workspace)
        run: cargo build --workspace
